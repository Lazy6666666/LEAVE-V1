## Continuous Integration

### Pre-commit Hooks

```yaml
pre-commit:
  - run: npm run type-check
  - run: npm run lint
  - run: npm run test:unit
  - run: npm run test:coverage -- --threshold 80

pre-push:
  - run: npm run test:integration
  - run: npm run test:e2e -- --project=chrome
```

### CI Pipeline

```yaml
ci_pipeline:
  stage_test:
    - unit_tests
    - integration_tests
    - type_check
    - lint_check
    - coverage_check

  stage_e2e:
    - e2e_tests_all_browsers
    - accessibility_tests
    - performance_tests

  stage_security:
    - security_scan
    - dependency_audit
    - vulnerability_check
```

