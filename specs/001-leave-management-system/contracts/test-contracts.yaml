## Integration Test Contracts

### API Endpoint Tests

#### /api/leaves.test.ts
```typescript
describe('/api/leaves', () => {
  // Contract: Authentication required
  it('should require authentication', async () => {
    // Given: No auth token
    // When: GET /api/leaves
    // Then: Should return 401
  })

  // Contract: Role-based access
  it('should return user\'s own leaves for employee', async () => {
    // Given: Employee role
    // When: GET /api/leaves
    // Then: Should only return user's leaves
  })

  // Contract: Manager sees team leaves
  it('should return team leaves for manager', async () => {
    // Given: Manager role
    // When: GET /api/leaves
    // Then: Should return team's leaves
  })
})
```

#### /api/leaves/{id}/approve.test.ts
```typescript
describe('/api/leaves/{id}/approve', () => {
  // Contract: Only managers can approve
  it('should allow manager to approve leave', async () => {
    // Given: Manager role and pending leave
    // When: POST /api/leaves/{id}/approve
    // Then: Should approve and update balance
  })

  // Contract: Cannot approve own leave
  it('should prevent approving own leave', async () => {
    // Given: User trying to approve own leave
    // When: POST /api/leaves/{id}/approve
    // Then: Should return 403
  })
})
```

