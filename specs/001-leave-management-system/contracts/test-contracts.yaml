# Test Contracts - Leave Management System

**Purpose**: Define test requirements and coverage contracts for QA implementation

## Unit Test Contracts

### Service Layer Tests

#### leave-balance.service.test.ts
```typescript
describe('Leave Balance Service', () => {
  // Contract: Calculate leave balance accurately
  it('should calculate available balance correctly', () => {
    // Given: User with 20 allocated, 5 used, 2 pending
    // When: Calculate balance
    // Then: Available = 20 - 5 - 2 = 13
  })

  // Contract: Validate sufficient balance before request
  it('should validate sufficient balance for new request', () => {
    // Given: User with 10 available days
    // When: Requesting 5 days
    // Then: Should approve
    // When: Requesting 15 days
    // Then: Should reject with insufficient balance error
  })

  // Contract: Handle carry-over correctly
  it('should calculate carry-over from previous year', () => {
    // Given: Previous year balance with carry-over
    // When: Calculating new year balance
    // Then: Should include carry-over up to policy limits
  })
})
```

