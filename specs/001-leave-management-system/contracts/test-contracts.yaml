## Coverage Requirements

### Minimum Coverage Thresholds

```yaml
coverage:
  statements: 80
  branches: 80
  functions: 80
  lines: 80
  exclude:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.config.ts"
    - "**/*.spec.ts"
    - "migrations/**"
```

### Critical Path Coverage

```yaml
critical_paths:
  - Authentication flow: 100%
  - Leave request submission: 100%
  - Leave approval process: 100%
  - Balance calculations: 100%
  - Notification delivery: 90%
  - Document access control: 100%
```

